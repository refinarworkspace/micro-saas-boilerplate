<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Compressor — MicroSaaS</title>
    <meta name="description" content="Compress JPG and PNG images instantly in your browser with adjustable quality. Free and private." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('msb-theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          container: { center: true, padding: '1.5rem', screens: { '2xl': '1280px' } },
          extend: {
            colors: {
              background: 'var(--bg)', foreground: 'var(--fg)', card: 'var(--card)',
              'card-foreground': 'var(--card-fg)', border: 'var(--border)', input: 'var(--border)',
              muted: 'var(--muted)', 'muted-foreground': 'var(--muted-fg)',
              primary: 'var(--primary)', 'primary-foreground': 'var(--primary-fg)', accent: 'var(--accent)',
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="site-header">
      <div class="container flex h-16 items-center justify-between">
        <a href="../index.html" class="flex items-center gap-2 font-bold">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-primary-foreground">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
          </span>
          <span class="text-lg" data-i18n="common.appName">MicroSaaS</span>
        </a>
        <nav class="hidden items-center gap-1 md:flex">
          <a href="../index.html" class="nav-link" data-i18n="nav.home">Home</a>
          <a href="../index.html#tools" class="nav-link is-active" data-i18n="nav.tools">Tools</a>
          <a href="../pricing.html" class="nav-link" data-i18n="nav.pricing">Pricing</a>
        </nav>
        <div class="flex items-center gap-1">
          <div class="relative">
            <button class="btn btn-ghost btn-icon" data-menu-toggle="#langMenu" data-i18n-aria="language.label" aria-label="Change language">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </button>
            <div id="langMenu" class="menu hidden" data-menu>
              <button class="menu-item" data-set-lang="en">English</button>
              <button class="menu-item" data-set-lang="zh">中文</button>
              <button class="menu-item" data-set-lang="es">Español</button>
            </div>
          </div>
          <button class="btn btn-ghost btn-icon" data-theme-toggle data-i18n-aria="theme.label" aria-label="Toggle theme">
            <svg data-theme-icon="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg data-theme-icon="moon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <a href="../login.html" class="btn btn-ghost hidden md:inline-flex" data-i18n="nav.login">Login</a>
          <a href="../login.html" class="btn btn-primary hidden md:inline-flex" data-i18n="nav.signup">Get started</a>
          <button class="btn btn-ghost btn-icon md:hidden" data-mobile-toggle="#mobileNav" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="mobileNav" class="hidden border-t border-border md:hidden">
        <nav class="container flex flex-col gap-1 py-4">
          <a href="../index.html" class="nav-link" data-i18n="nav.home">Home</a>
          <a href="../index.html#tools" class="nav-link" data-i18n="nav.tools">Tools</a>
          <a href="../pricing.html" class="nav-link" data-i18n="nav.pricing">Pricing</a>
        </nav>
      </div>
    </header>

    <main class="flex-1 container py-10 lg:py-14">
      <div class="mx-auto max-w-2xl text-center">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl" data-i18n="tools.imageCompressor.title"></h1>
        <p class="mt-3 text-muted-foreground" data-i18n="tools.imageCompressor.description"></p>
      </div>

      <div class="mt-10 grid gap-6 lg:grid-cols-2">
        <!-- Config -->
        <section class="card p-5">
          <div id="uploader" role="button" tabindex="0"
            class="flex cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-border px-6 py-12 text-center transition hover:border-primary">
            <span class="flex h-12 w-12 items-center justify-center rounded-full bg-primary-soft">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
            </span>
            <p class="text-sm font-medium text-muted-foreground" data-i18n="tools.imageCompressor.dropHint"></p>
            <input id="fileInput" type="file" accept="image/*" class="hidden" />
          </div>

          <div id="controls" class="mt-5 hidden space-y-5">
            <div class="overflow-hidden rounded-lg border border-border bg-muted">
              <img id="originalPreview" alt="original" class="mx-auto max-h-64 w-auto object-contain" />
            </div>
            <div>
              <div class="flex items-center justify-between">
                <label for="quality" class="text-sm font-medium" data-i18n="tools.imageCompressor.quality"></label>
                <span id="qualityValue" class="text-sm text-muted-foreground">70%</span>
              </div>
              <input id="quality" type="range" min="10" max="100" value="70" class="mt-2 w-full" />
            </div>
            <button id="resetBtn" class="btn btn-outline w-full" data-i18n="tools.imageCompressor.reset"></button>
          </div>
        </section>

        <!-- Result -->
        <section class="card p-5">
          <div id="emptyResult" class="flex h-full min-h-[16rem] items-center justify-center text-center text-sm text-muted-foreground" data-i18n="tools.imageCompressor.noFile"></div>
          <div id="result" class="hidden space-y-5">
            <div class="overflow-hidden rounded-lg border border-border bg-muted">
              <img id="compressedPreview" alt="compressed" class="mx-auto max-h-64 w-auto object-contain" />
            </div>
            <div class="grid grid-cols-3 gap-3 text-center">
              <div class="rounded-lg border border-border p-3">
                <p class="text-xs uppercase text-muted-foreground" data-i18n="tools.imageCompressor.original"></p>
                <p id="statOriginal" class="mt-1 text-sm font-semibold"></p>
              </div>
              <div class="rounded-lg border border-border p-3">
                <p class="text-xs uppercase text-muted-foreground" data-i18n="tools.imageCompressor.compressed"></p>
                <p id="statCompressed" class="mt-1 text-sm font-semibold"></p>
              </div>
              <div class="rounded-lg border border-border p-3">
                <p class="text-xs uppercase text-muted-foreground" data-i18n="tools.imageCompressor.saved"></p>
                <p id="statSaved" class="mt-1 text-sm font-semibold text-primary"></p>
              </div>
            </div>
            <button id="downloadBtn" class="btn btn-primary w-full" data-i18n="tools.imageCompressor.downloadCompressed"></button>
          </div>
        </section>
      </div>
    </main>

    <footer class="border-t border-border bg-muted">
      <div class="container py-10 text-center text-sm text-muted-foreground">
        <p>&copy; <span id="year"></span> MicroSaaS. <span data-i18n="footer.rights"></span></p>
      </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/theme.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      (function () {
        var uploader = document.getElementById('uploader');
        var fileInput = document.getElementById('fileInput');
        var controls = document.getElementById('controls');
        var emptyResult = document.getElementById('emptyResult');
        var result = document.getElementById('result');
        var originalPreview = document.getElementById('originalPreview');
        var compressedPreview = document.getElementById('compressedPreview');
        var quality = document.getElementById('quality');
        var qualityValue = document.getElementById('qualityValue');
        var statOriginal = document.getElementById('statOriginal');
        var statCompressed = document.getElementById('statCompressed');
        var statSaved = document.getElementById('statSaved');
        var downloadBtn = document.getElementById('downloadBtn');
        var resetBtn = document.getElementById('resetBtn');

        var img = new Image();
        var originalSize = 0;
        var fileBaseName = 'image';
        var currentBlob = null;

        function compress() {
          if (!img.src) return;
          var canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(
            function (blob) {
              if (!blob) return;
              currentBlob = blob;
              if (compressedPreview.src) URL.revokeObjectURL(compressedPreview.src);
              compressedPreview.src = URL.createObjectURL(blob);
              statOriginal.textContent = Utils.formatBytes(originalSize);
              statCompressed.textContent = Utils.formatBytes(blob.size);
              var saved = originalSize > 0 ? Math.max(0, Math.round((1 - blob.size / originalSize) * 100)) : 0;
              statSaved.textContent = saved + '%';
              emptyResult.classList.add('hidden');
              result.classList.remove('hidden');
            },
            'image/jpeg',
            quality.value / 100
          );
        }

        var debouncedCompress = Utils.debounce(compress, 250);

        function handleFile(file) {
          if (!file || !/^image\//.test(file.type)) return;
          originalSize = file.size;
          fileBaseName = file.name.replace(/\.[^.]+$/, '') || 'image';
          var reader = new FileReader();
          reader.onload = function () {
            originalPreview.src = reader.result;
            img = new Image();
            img.onload = compress;
            img.src = reader.result;
            controls.classList.remove('hidden');
            uploader.classList.add('hidden');
          };
          reader.readAsDataURL(file);
        }

        uploader.addEventListener('click', function () { fileInput.click(); });
        uploader.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
        });
        uploader.addEventListener('dragover', function (e) { e.preventDefault(); uploader.classList.add('border-primary'); });
        uploader.addEventListener('dragleave', function () { uploader.classList.remove('border-primary'); });
        uploader.addEventListener('drop', function (e) {
          e.preventDefault();
          uploader.classList.remove('border-primary');
          if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', function () {
          if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        quality.addEventListener('input', function () {
          qualityValue.textContent = quality.value + '%';
          debouncedCompress();
        });

        downloadBtn.addEventListener('click', function () {
          if (currentBlob) Utils.downloadFile(currentBlob, fileBaseName + '-compressed.jpg');
        });

        resetBtn.addEventListener('click', function () {
          img = new Image();
          currentBlob = null;
          originalSize = 0;
          fileInput.value = '';
          controls.classList.add('hidden');
          result.classList.add('hidden');
          emptyResult.classList.remove('hidden');
          uploader.classList.remove('hidden');
        });
      })();
    </script>
  </body>
</html>
