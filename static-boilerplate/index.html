    <!-- Apply the saved theme before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('msb-theme');
          var dark = t
            ? t === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind via CDN + theme-aware color tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          container: {
            center: true,
            padding: '1.5rem',
            screens: { '2xl': '1280px' },
          },
          extend: {
            colors: {
              background: 'var(--bg)',
              foreground: 'var(--fg)',
              card: 'var(--card)',
              'card-foreground': 'var(--card-fg)',
              border: 'var(--border)',
              input: 'var(--border)',
              muted: 'var(--muted)',
              'muted-foreground': 'var(--muted-fg)',
              primary: 'var(--primary)',
              'primary-foreground': 'var(--primary-fg)',
              accent: 'var(--accent)',

          },
        },
      };
    </script>

    <script>
      // Year
      document.getElementById('year').textContent = new Date().getFullYear();

      // Render the 3 pricing cards from the i18n dictionary (re-render on lang change).
      function renderPricing() {
        var grid = document.getElementById('pricingGrid');
        if (!grid) return;
        var tiers = ['starter', 'pro', 'business'];
        grid.innerHTML = '';
        tiers.forEach(function (id) {
          var base = 'pricing.tiers.' + id;
          var features = window.I18n.t(base + '.features') || [];
          var popular = id === 'pro';
          var card = document.createElement('div');
          card.className =
            'card relative flex flex-col p-6' +
            (popular ? ' ring-1' : '');
          if (popular) card.style.boxShadow = '0 10px 40px -12px var(--primary)';
          var featuresHtml = features
            .map(function (f) {
              return (
                '<li class="flex items-start gap-2.5 text-sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);margin-top:2px;flex-shrink:0"><path d="M20 6 9 17l-5-5"/></svg><span>' +
                f +
                '</span></li>'
              );
            })
            .join('');
          card.innerHTML =
            (popular
              ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 rounded-full px-3 py-1 text-xs font-semibold" style="background:var(--primary);color:var(--primary-fg)">' +
                window.I18n.t('pricing.mostPopular') +
                '</span>'
              : '') +
            '<h3 class="text-lg font-semibold">' +
            window.I18n.t(base + '.name') +
            '</h3>' +
            '<p class="mt-1 text-sm text-muted-foreground">' +
            window.I18n.t(base + '.description') +
            '</p>' +
            '<div class="mt-4 flex items-end gap-1"><span class="text-4xl font-bold">' +
            window.I18n.t(base + '.price') +
            '</span><span class="mb-1 text-sm text-muted-foreground">' +
            window.I18n.t('pricing.monthly') +
            '</span></div>' +
            '<ul class="mt-6 flex-1 space-y-3">' +
            featuresHtml +
            '</ul>' +
            '<a href="login.html" class="btn ' +
            (popular ? 'btn-primary' : 'btn-outline') +
            ' mt-6 w-full">' +
            window.I18n.t(base + '.cta') +
            '</a>';
          grid.appendChild(card);
        });
      }
      renderPricing();
      document.addEventListener('i18n:applied', renderPricing);
    </script>
  </body>
</html>
